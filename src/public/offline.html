<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#04060a"/>
  <script>
  (function () {
    var KEY = "satorx_lang", DEF = "pt-BR";
    function norm(v) {
      if (!v) return "";
      v = String(v).trim();
      if (/^pt([-_]br)?$/i.test(v)) return "pt-BR";
      if (/^en(-[a-z]+)?$/i.test(v)) return "en";
      return "";
    }
    function cookie() {
      var m = document.cookie.match(/(?:^|;\s*)satorx_lang=([^;]*)/);
      return m ? decodeURIComponent(m[1]) : "";
    }
    var lang = "";
    try { lang = norm(localStorage.getItem(KEY)); } catch (e) {}
    if (!lang) lang = norm(cookie());
    if (!lang) { try { lang = norm(sessionStorage.getItem(KEY)); } catch (e) {} }
    if (!lang) lang = DEF;
    try { localStorage.setItem(KEY, lang); } catch (e) {}
    try { sessionStorage.setItem(KEY, lang); } catch (e) {}
    var secure = location.protocol === "https:" ? "; Secure" : "";
    document.cookie = KEY + "=" + encodeURIComponent(lang) + "; Path=/; Max-Age=31536000; SameSite=Lax" + secure;
    document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
    window.__SATOR_LANG = lang;
    var MENU = {
      "pt-BR": {
        "menu.start": "▶  Iniciar partida",
        "menu.online": "Jogar online",
        "menu.matches": "Ranking",
        "menu.rules": "Regras",
        "menu.options": "Ajustes",
        "menu.ia": "Rede neural",
        "menu.footer": "Sator Ngx v5  ·  Motor híbrido"
      },
      en: {
        "menu.start": "▶  Start game",
        "menu.online": "Play online",
        "menu.matches": "Ranking",
        "menu.rules": "Rules",
        "menu.options": "Settings",
        "menu.ia": "Neural net",
        "menu.footer": "Sator Ngx v5  ·  Hybrid engine"
      }
    };
    function heal() {
      var table = (document.documentElement.lang || "").toLowerCase().indexOf("en") === 0 ? MENU.en : MENU["pt-BR"];
      var broken = false;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (!key || !table[key]) return;
        var text = (el.textContent || "").replace(/\s+/g, " ").trim();
        if (text.toLowerCase() !== key.toLowerCase()) return;
        el.textContent = table[key];
        broken = true;
      });
      if (!broken) return;
      try {
        if (sessionStorage.getItem("sator_i18n_purged") === "1") return;
        sessionStorage.setItem("sator_i18n_purged", "1");
      } catch (e) { return; }
      var done = Promise.resolve();
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        done = navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        });
      }
      done.then(function () {
        if (!window.caches) { location.reload(); return; }
        return caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        });
      }).then(function () { location.reload(); }).catch(function () { location.reload(); });
    }
    document.addEventListener("DOMContentLoaded", heal);
    window.addEventListener("load", function () { setTimeout(heal, 0); });
  })();
  </script>
  <script src="/js/i18n.js?v=5"></script>
  <title data-i18n="meta.offline.title">Offline — Sator Engine</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <style>
    :root { --gold: #c9a84c; --text: #e8e0d0; --bg: #04060a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      text-align: center;
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 8px;
      padding: 32px 28px;
      background: linear-gradient(160deg, #0d1018 0%, #080c12 100%);
      box-shadow: 0 0 40px rgba(201,168,76,0.08);
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
    p { line-height: 1.6; opacity: 0.88; margin-bottom: 22px; font-size: 0.95rem; }
    a {
      display: inline-block;
      padding: 12px 28px;
      border: 1px solid rgba(201,168,76,0.45);
      border-radius: 4px;
      color: var(--gold);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    a:hover { background: rgba(201,168,76,0.1); }
  </style>
</head>
<body>
  <div class="card">
    <h1 data-i18n="offline.title">Sem conexão</h1>
    <p data-i18n="offline.body">O Sator Engine precisa de rede para o motor e APIs. Verifique sua conexão e tente de novo.</p>
    <a href="/" data-i18n="offline.back">Voltar ao início</a>
  </div>
</body>
</html>
