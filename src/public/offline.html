<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Sator"/>
    <script>
  (function () {
    var lang = "";
    try { lang = localStorage.getItem("satorx_lang_choice") || ""; } catch (e) {}
    lang = String(lang).trim();
    if (/^en(-[a-z]+)?$/i.test(lang)) lang = "en";
    else if (/^pt([-_]br)?$/i.test(lang)) lang = "pt-BR";
    else lang = "";
    if (lang) {
      document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
      window.__SATOR_LANG = lang;
    }
  })();
  </script>
<script src="/js/i18n.js?v=8"></script>
  <title data-i18n="meta.offline.title">Offline — Sator Engine</title>
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"/>
  <link rel="icon" href="/favicon.ico" sizes="48x48"/>
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192"/>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
  <link rel="apple-touch-startup-image" href="/img/pwa-splash.jpg" media="(orientation: portrait)"/>
  <link rel="preload" href="/img/pwa-splash-live.jpg" as="image" fetchpriority="high"/>
  <link rel="stylesheet" href="/css/pwa-splash.css"/>
  <style>
    :root { --gold: #c9a84c; --text: #e8e0d0; --bg: #04060a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      text-align: center;
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 8px;
      padding: 32px 28px;
      background: linear-gradient(160deg, #0d1018 0%, #080c12 100%);
      box-shadow: 0 0 40px rgba(201,168,76,0.08);
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
    p { line-height: 1.6; opacity: 0.88; margin-bottom: 22px; font-size: 0.95rem; }
    a {
      display: inline-block;
      padding: 12px 28px;
      border: 1px solid rgba(201,168,76,0.45);
      border-radius: 4px;
      color: var(--gold);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    a:hover { background: rgba(201,168,76,0.1); }
  </style>
</head>
<body>
  <div id="pwa-splash" role="status" aria-live="polite" aria-busy="true" aria-label="Initializing engine">
    <div class="pwa-splash__art">
      <img src="/img/pwa-splash-live.jpg" alt="" width="576" height="1024" fetchpriority="high" decoding="sync"/>
      <div class="pwa-splash__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Initializing engine"><span class="pwa-splash__fill"></span></div>
    </div>
  </div>
  <script src="/js/pwa-splash.js"></script>
  <div class="card">
    <h1 data-i18n="offline.title">Sem conexão</h1>
    <p data-i18n="offline.body">O Sator Engine precisa de rede para o motor e APIs. Verifique sua conexão e tente de novo.</p>
    <a href="/" data-i18n="offline.back">Voltar ao início</a>
  </div>
  <script src="/js/pwa-register.js" defer></script>
</body>
</html>
